<a
    href="{{ href }}"
    class="group flex items-center rounded-3xl bg-zinc-900 px-6 py-6 transition duration-300 hover:bg-zinc-800">

    <img
        src="{{ icon }}"
        class="h-10 w-10 opacity-90">

    <div class="ml-6 flex-1">

        <h2
            class="text-xl font-medium">

            {{ title }}

        </h2>

        <p
            class="mt-1 text-sm text-zinc-400">

            {{ description }}

        </p>

    </div>

    <img
        src="/static/icons/arrow.svg"
        class="h-6 w-6 opacity-50 transition group-hover:translate-x-1">

</a>
