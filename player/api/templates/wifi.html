{% extends "base.html" %}

{% block content %}

<div class="mb-10">

    <a
        href="/"
        class="text-zinc-400 transition hover:text-white">

        ← Back

    </a>

</div>

<h1
    class="mb-2 text-center text-4xl font-light tracking-[0.4rem]">

    WI-FI

</h1>

<p
    class="mb-12 text-center text-zinc-500">

    Connect your frame to a wireless network.

</p>

{% if networks %}

<div class="space-y-4">

    {% for network in networks %}

    <button
        class="flex w-full items-center justify-between rounded-3xl bg-zinc-900 p-6 transition hover:bg-zinc-800">

        <div class="flex items-center gap-4">

            <img
                src="/static/icons/wifi.svg"
                class="h-6 w-6 opacity-80">

            <div class="text-left">

                <h2 class="text-lg font-light">

                    {{ network.ssid }}

                </h2>

                <p class="text-sm text-zinc-500">

                    Tap to connect

                </p>

            </div>

        </div>

        <img
            src="/static/icons/arrow.svg"
            class="h-5 w-5 opacity-40">

    </button>

    {% endfor %}

</div>

{% else %}

<div class="mt-32 text-center">

    <img
        src="/static/icons/wifi.svg"
        class="mx-auto h-16 opacity-30">

    <p
        class="mt-8 text-xl text-zinc-400">

        No Wi-Fi networks found

    </p>

    <p
        class="mt-3 text-sm text-zinc-500">

        Make sure Wi-Fi is enabled and try again.

    </p>

</div>

{% endif %}

{% endblock %}
